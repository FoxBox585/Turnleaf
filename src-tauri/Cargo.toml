[package]
name = "turnleaf"
version = "1.0.1"
description = "Turnleaf — a skeuomorphic bullet journal"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Repositioning the traffic lights on the leather bar (tao's config only moves
# them sideways). Same crates Tauri itself uses on macOS, same feature style.
[target.'cfg(target_os = "macos")'.dependencies]
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSButton", "NSControl", "NSView", "NSWindow"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSGeometry"] }

[lib]
name = "turnleaf_lib"
crate-type = ["staticlib", "cdylib", "rlib"]
