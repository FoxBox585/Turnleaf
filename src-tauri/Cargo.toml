[package]
name = "turnleaf"
version = "0.7.0"
description = "Turnleaf — a skeuomorphic bullet journal"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[lib]
name = "turnleaf_lib"
crate-type = ["staticlib", "cdylib", "rlib"]
